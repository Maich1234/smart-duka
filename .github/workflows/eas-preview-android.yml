name: Duqana Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duqana-android-preview
  cancel-in-progress: false

jobs:
  eas-preview:
    name: Submit Android APK to Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64. Android Firebase configuration is required."
            exit 1
          fi

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          python3 -m json.tool google-services.json >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Submit EAS preview build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --no-wait

      - name: Build dashboard
        if: always()
        run: |
          echo "### Duqana Android builds" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Expo build dashboard](https://expo.dev/accounts/maich123/projects/smart-duka/builds)" >> "$GITHUB_STEP_SUMMARY"
          echo "A successful submission starts an EAS cloud build. Check its status and APK download on Expo." >> "$GITHUB_STEP_SUMMARY"
